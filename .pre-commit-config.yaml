# ============================================================
# .pre-commit-config.yaml (ALL-PY-SRC-REPOS)
# ============================================================
# Updated: 2026-09-25 add uvx zizmor check
#
# REQ: Professional projects using Python src/ SHOULD include pre-commit checks.
# WHY: Minimize git diffs, catch common issues early, and support collaboration.
#
# OBS: These hooks use and do NOT override:
#   - .editorconfig (whitespace / indentation)
#   - .gitattributes (EOL normalization)
#   - pyproject.toml (Python tool settings)
#
# OPTIONAL LOCAL USAGE (keep hooks updated):
#   uv run prek install -f
#   uv run prek update --freeze --cooldown-days 7
#
# OPTIONAL LOCAL USAGE (run all hooks on all git-tracked files):
#   uv run prek run --all-files
#   The first time, it may indicate errors / fixes,
#   so just re-run the command (up arrow) and it often goes all green.
#
# NOTE: Enabling prek is optional. It is not needed to clone or commit.
# You can skip the installed Git hook with --no-verify, e.g.:
#   git commit -m "your message" --no-verify

exclude: |
  (?x)^(
    .*\.egg-info/|
    .*\.log|
    \.coverage|
    \.DS_Store|
    \.ipynb_checkpoints/|
    \.mypy_cache/|
    \.nox/|
    \.pytest_cache/|
    \.ruff_cache/|
    \.tox/|
    \.venv/|
    __pycache__/|
    _minted.*/|
    build/|
    coverage\.xml|
    dist/|
    htmlcov/|
    lake-packages/|
    node_modules/|
    out/|
    site/
  )

repos:
  # === REPO: PRE-COMMIT HOOKS (cross-platform, zero config) ===
  #
  # These hooks prevent problems that show up later as:
  #   - mysterious diffs
  #   - broken builds on another OS

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # === PRE-COMMIT: NORMALIZE FILE FORMATTING ===

      - id: trailing-whitespace
        name: A1) Clean trailing whitespace (per .editorconfig)
        args: [--markdown-linebreak-ext=md] # Preserves markdown double-space line breaks

      - id: end-of-file-fixer
        name: A2) End files with a newline (per .gitattributes)

      - id: mixed-line-ending
        name: A3) Normalize line endings to LF before linters
        args: [--fix=lf] # OBS: Windows working copies may be CRLF.

      # === PRE-COMMIT: CHECK DATA FILE FORMATS ===

      - id: check-json
        name: B1) Validate JSON syntax (except .vscode/)
        # WHY: VS Code settings may include comments, which are non-standard JSON.
        exclude: (^|/)\.vscode/.*\.json$

      - id: check-toml
        name: B2) Validate TOML syntax

      - id: check-yaml
        name: B3) Validate YAML syntax
        files: \.(yml|yaml)$
        # WHY: VS Code config files are editor-specific.
        exclude: ^\.vscode/

      # === PRE-COMMIT: CHECK FOR COMMON PROBLEMS ===

      - id: check-added-large-files
        name: C1) Prevent accidental commits of large binaries
        args: [--maxkb=2000] # WHY: 2MB is a common threshold for large files

      - id: check-merge-conflict
        name: C2) Prevent committing merge conflicts

      - id: check-case-conflict
        name: C3) Check for filename case conflicts

  # === REPO: RUFF PRE-COMMIT (for Python code) ===

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:

      # === RUFF PRE-COMMIT CHECKS ===
      # REQ: Lint first, format last, so lint autofixes land already formatted
      #      and the run settles in one pass instead of needing a re-run.
      - id: ruff-check
        name: D1) Ruff linter (autofix errors, style issues)
        args: [--fix, --exit-non-zero-on-fix]

      - id: ruff-format
        name: D2) Ruff format (last, after lint fixes)

  # === EXTRA LOCAL HOOKS ===

  - repo: local
    hooks:
      # === ZIZMOR: GITHUB ACTIONS SECURITY AUDIT (advisory) ===
      # WHY: --no-exit-codes reports findings without blocking the commit;
      #      verbose prints them even on a passing run.
      # WHY: files limits this to when a workflow or Dependabot file exists,
      #      avoiding zizmor's "no inputs collected" error.
      - id: zizmor
        name: E1) zizmor (advisory audit of GitHub Actions workflows)
        entry: uvx zizmor@latest --no-exit-codes .github/
        language: system
        pass_filenames: false
        verbose: true
        files: ^\.github/(workflows/[^/]+\.ya?ml|dependabot\.ya?ml)$

# === GLOBAL SETTINGS ===
# ALT: Set fail_fast to true to stop at first failure.
fail_fast: false # WHY: Run all hooks so all issues are visible at once.
