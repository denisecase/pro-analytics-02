# ============================================================
# prek.toml (ALL-PY-SRC-REPOS)
# ============================================================
# Updated: 2026-10-09
#
# REQ: Professional Python projects SHOULD include Git hooks.
# WHY: Catch common problems before they become part of the project.
#
# Reliable analytics depend on reliable code and data.
# Small mistakes, such as invalid data files, inconsistent formatting,
# or unresolved merge conflicts, can cause problems later.
#
# Git hooks are automated checks that run before a Git commit.
# prek runs these checks and can fix some problems automatically.
# This helps keep projects consistent, reduces troubleshooting,
# and makes collaboration easier.
#
# The prek.toml file defines which checks to run.
# Including it gives everyone access to the same checks.
# Installing the hooks locally enables automatic checks before commits.
# Installation is optional.
#
# OBS: These hooks use and do NOT override:
#   - .editorconfig (whitespace / indentation)
#   - .gitattributes (EOL normalization)
#   - pyproject.toml (Python tool settings)
#
# OPTIONAL RECOMMENDED INSTALL AND UPDATE:
#
#   uvx prek install --force
#   uvx prek update
#
# OPTIONAL RECOMMENDED USAGE (run hooks on all git-tracked files):
#
#   git add -A
#   uvx prek run --all-files
#
# OPTIONAL REPEAT:The first time, it may indicate errors / fixes.
# Re-run (up arrow) and it often goes green.
#
#   uvx prek run --all-files
#
# OPTIONAL SKIP: You can skip running the hooks if needed:
#
#   git commit -m "your message here" --no-verify
# ============================================================

# ============================================================
# === GLOBAL SETTINGS ===
# ============================================================

# Don't check any of these locations
# WHY: A long list allows us to reuse this file in multiple projects without modification.
exclude = '''(?x)^(
    .*\.egg-info/|
    .*\.log|
    \.coverage|
    \.DS_Store|
    \.ipynb_checkpoints/|
    \.lake/|
    \.mypy_cache/|
    \.nox/|
    \.pytest_cache/|
    \.ruff_cache/|
    \.tox/|
    \.venv/|
    __pycache__/|
    _minted.*/|
    build/|
    coverage\.xml|
    dist/|
    htmlcov/|
    lake-packages/|
    node_modules/|
    out/|
    site/
  )'''

# CUSTOM: Set fail_fast to true to stop at first failure.
fail_fast = false
# WHY: Run all hooks so all issues are visible at once.

# ============================================================
# === REPO: COMMON GIT HOOKS (cross-platform, zero config) ===
#
# These hooks prevent problems that show up later as:
#   - mysterious diffs
#   - broken builds on another OS
# ============================================================

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# === HOOK: NORMALIZE FILE FORMATTING ===

[[repos.hooks]]
id = "trailing-whitespace"
name = "A1) Clean trailing whitespace (per .editorconfig)"
args = ["--markdown-linebreak-ext=md"]
# WHY: Preserves markdown double-space line breaks

[[repos.hooks]]
id = "end-of-file-fixer"
name = "A2) End files with a newline (per .gitattributes)"


[[repos.hooks]]
id = "mixed-line-ending"
name = "A3) Normalize line endings to LF before linters"
args = ["--fix=lf"]
# OBS: Windows working copies may be CRLF.

# === HOOK: CHECK DATA FILE FORMATS ===

[[repos.hooks]]
id = "check-json"
name = "B1) Validate JSON syntax (except .vscode/)"
exclude = '(^|/)\.vscode/.*\.json$'
# WHY: VS Code settings may include comments, which are non-standard JSON.

[[repos.hooks]]
id = "check-toml"
name = "B2) Validate TOML syntax"

[[repos.hooks]]
id = "check-yaml"
name = "B3) Validate YAML syntax"
files = '\.(yml|yaml)$'
exclude = '^\.vscode/'
# WHY: VS Code config files are editor-specific.

# === HOOK: CHECK FOR COMMON PROBLEMS ===

[[repos.hooks]]
id = "check-added-large-files"
name = "C1) Prevent accidental commits of large binaries"
args = ["--maxkb=2000"]
# WHY: 2MB is a common threshold for large files

[[repos.hooks]]
id = "check-merge-conflict"
name = "C2) Prevent committing merge conflicts"

[[repos.hooks]]
id = "check-case-conflict"
name = "C3) Check for filename case conflicts"


# ============================================================
# === REPO: RUFF HOOKS (for Python code) ===
# ============================================================
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.10"

# === RUFF FORMAT PYTHON ===

[[repos.hooks]]
id = "ruff-format"
name = "D1) Ruff format (before linting)"

# === RUFF LINT PYTHON (standard fixes) ===

[[repos.hooks]]
id = "ruff"
name = "D2) Ruff linter (autofix errors, style issues )"
args = ["--fix", "--exit-non-zero-on-fix"]
