# ============================================================
# .github/dependabot.yml (ALL-PY-SRC-REPOS)
# ============================================================
# Updated: 2026-09-22
#
# REQ: This repository SHOULD track dependency updates automatically.
# WHY: Dependencies, development tools, pre-commit hooks, and GitHub
#      Actions may receive security, compatibility, and maintenance updates.
# OBS: Security updates are not delayed by the configured cooldown.
# CUSTOM: Update interval if CI cadence or security posture changes.

version: 2

updates:
  # ============================================================
  # PYTHON / UV
  # ============================================================

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "(deps)"
    groups:
      python:
        patterns:
          - "*"

  # ============================================================
  # GITHUB ACTIONS
  # ============================================================

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # ============================================================
  # PRE-COMMIT
  # ============================================================

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "(deps)"
    groups:
      pre-commit:
        patterns:
          - "*"
