# ============================================================
# .github/workflows/ci-python-zensical.yml (ALL-PY-SRC-REPOS)
# ============================================================
# Updated: 2026-08-16
#
# WHY: Continuous Integration (CI) ensures repository hygiene,
#      Python correctness, testing, and documentation builds.
# REQ: CI MUST NOT introduce rules that are not reproducible locally.
# OBS: CI validates only; it never persists file changes or deploys docs.
# OBS: yamllint config lives at .github/.yamllint.yml (not repo root).

# Name shown in the repo Actions tab.
name: CI (Python + Zensical)

on:
  push:
    branches: [main]  # WHY: Validate on every push to GitHub branch `main`.
  pull_request:
    branches: [main]  # WHY: Validate pull requests before merge.
  workflow_dispatch:  # WHY: Allow manual trigger from Actions tab.

permissions:          # WHY: Least privilege; this job only needs repository read access.
  contents: read      # WHY: CI validates repository contents and never pushes changes.

concurrency:
  group: ci-python-zensical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  # WHY: Cancel stale CI runs for the same workflow/ref when a newer commit arrives.
  # OBS: Different PRs and branches still run independently.

env:
  PYTHONUNBUFFERED: "1"     # WHY: Real-time log output in CI.
  PYTHONIOENCODING: "utf-8" # WHY: Consistent encoding across platforms.
  UV_FROZEN: "1"            # WHY: CI MUST use the committed lockfile without updating it.

jobs:
  ci:
    name: Repo checks and Zensical build
    runs-on: ubuntu-latest  # WHY: Linux matches most production deployments.
    timeout-minutes: 30     # WHY: Fail fast if a step hangs unexpectedly.

    steps:
      # ============================================================
      # A) ASSEMBLE: Checkout code and set up environment
      # ============================================================

      - name: A1) Checkout repository code
        uses: actions/checkout@v7
        # WHY: Required so all subsequent steps can access repo files.

      - name: A2) Install uv (with caching)
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          # WHY: Cache uv-managed artifacts for faster subsequent runs.
          cache-dependency-glob: "uv.lock"
          # WHY: Invalidate dependency cache when the committed lockfile changes.

      - name: A3) Install project Python
        run: uv python install
        # WHY: Ensures the Python version declared in .python-version is available.
        # OBS: uv manages the interpreter locally in the CI environment.

      - name: A4) Install dependencies from committed lockfile
        run: uv sync --frozen
        # WHY: Install all configured dependency groups exactly from uv.lock.
        # REQ: CI MUST fail rather than update a stale or incompatible lockfile.

      - name: A5) Show tool versions
        run: |
          uv --version
          uv run python --version
          uv run python -m ruff --version
          uv run ty --version
          if [ -f "zensical.toml" ]; then
            uv run python -m zensical --version
          fi
        # WHY: Version output makes CI logs easier to debug when tools change.

      - name: A6) Run pre-commit on all files
        run: uv run pre-commit run --all-files
        # WHY: Run the same repository hygiene checks used locally.
        # OBS: A clean commit should already pass without file changes.
        # OBS: Autofixing hooks may modify the ephemeral CI checkout.
        #      If they do, pre-commit fails because the committed files
        #      were not already in their required final state.
        # FIX: Run this command locally, review any autofixes, fix remaining
        #      issues by hand, then git add, commit, and push again.

      # ============================================================
      # B) BASELINE CHECKS: Tools not covered by pre-commit
      # ============================================================

      - name: B1) Validate pyproject.toml schema
        run: uvx "validate-pyproject[all]" pyproject.toml
        # WHY: Catch malformed project metadata before downstream CI or release work.

      - name: B2) Run ty type checker
        run: uv run ty check
        continue-on-error: true
        # WHY: Catch type errors that Ruff does not check.
        # OBS: ty uses the installed project environment for analysis.
        # OBS: Not included in pre-commit because it requires the full environment.
        # OBS: continue-on-error keeps type checking non-blocking in this workflow.

      # ============================================================
      # C) COVERAGE & TESTING: Python tests
      # ============================================================

      - name: C1) Run pytest
        run: uv run python -m pytest
        # WHY: Confirm all Python tests pass in a clean CI environment.
        # OBS: pytest config lives in pyproject.toml [tool.pytest.ini_options].
        # OBS: Not included in pre-commit because tests can be slower.

      # ============================================================
      # D) DOCS: Build documentation without deployment
      # ============================================================

      - name: D1) Build documentation with Zensical
        run: |
          if [ -f "zensical.toml" ]; then
            uv run python -m zensical build
          else
            echo "No zensical.toml found; skipping docs build."
          fi
        # WHY: Confirm documentation builds without errors.
        # OBS: This workflow builds only; deployment is handled separately.
        # OBS: Conditional on zensical.toml so this workflow remains reusable
        #      across src-layout Python repos that do not require documentation.
