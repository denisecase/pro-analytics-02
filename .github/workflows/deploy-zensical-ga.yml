# ============================================================
# .github/workflows/deploy-zensical-ga.yml (CUSTOM: ALL-PY-REPOS+GA)
# ============================================================
# Updated: 2026-09-17
#
# WHY: Build and deploy documentation to GitHub Pages on pushes to main.
# REQ: Repo Settings -> Pages -> Build and deployment -> Source:
#      GitHub Actions
# WHY: Without this setting, the deploy-pages action will fail with a 403.
# REQ: Repository MUST contain .python-version.
# WHY: The repository declares the Python version used locally and by CI.
# REQ: Deployment MUST use the committed uv.lock without updating it.

# Name shown in the repo Actions tab.
name: Docs Deploy (Zensical + GA + AI)

on:
  push:
    branches: [main]  # WHY: Deploy docs on every push to GitHub branch `main`.
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC
  workflow_dispatch:  # WHY: Allow manual trigger from Actions tab.

permissions:
  contents: read   # WHY: Needed to checkout code.
  pages: write     # WHY: Required to deploy to GitHub Pages.
  id-token: write  # WHY: Required by deploy-pages for OIDC authentication.

concurrency:
  group: github-pages
  cancel-in-progress: false
  # WHY: GitHub Pages is a shared deployment target.
  # OBS: Do not cancel an in-progress Pages deployment with another deployment.

env:
  PYTHONUNBUFFERED: "1"     # WHY: Real-time log output in CI.
  PYTHONIOENCODING: "utf-8" # WHY: Consistent encoding across platforms.
  UV_FROZEN: "1"            # WHY: Deployment MUST use uv.lock without updating it.

jobs:
  docs:
    name: Deploy Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30 # WHY: Fail fast if a step hangs unexpectedly.

    steps:
      # ============================================================
      # A) ASSEMBLE: Checkout code and set up environment
      # ============================================================

      - name: A1) Checkout repository code
        uses: actions/checkout@v7
        # WHY: Required so all subsequent steps can access repo files.

      - name: A2) Configure GitHub Pages
        uses: actions/configure-pages@v6
        # WHY: Sets Pages metadata used by upload-pages-artifact and deploy-pages.
        # OBS: Must run before the build step so base URL is available if needed.

      - name: A3) Install uv (with caching)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # WHY: Invalidate dependency cache when the committed lockfile changes.

      - name: A4) Install project Python
        run: uv python install
        # WHY: Ensures the Python version declared in .python-version is available.
        # OBS: uv manages the interpreter locally in the CI environment.

      - name: A5) Install dependencies from committed lockfile
        run: uv sync --frozen
        # WHY: Install all configured dependency groups exactly from uv.lock.
        # REQ: Deployment MUST fail rather than update a stale lockfile.

      - name: A6) Show tool versions
        run: |
          uv --version
          uv run python --version
          if [ -f "zensical.toml" ]; then
            uv run python -m zensical --version
          fi
        # WHY: Version output makes deployment logs easier to debug when tools change.

      # ============================================================
      # B) BUILD VIEW ANALYTICS AND INTEGRATED AI CONTEXT
      # ============================================================

      - name: B1) Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GA4_SERVICE_ACCOUNT }}
        # WHY: Obtain short-lived Google credentials through GitHub OIDC.
        # OBS: Exports credentials for subsequent Google API operations.

      - name: B2) Generate anonymous view analytics data (GA4 -> view-analytics.json)
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: uv run python -m pro_analytics_02.view_analytics.build_analytics
        # WHY: Query GA4 for the current academic block.
        # WHY: Write docs/assets/data/view-analytics.json before building.
        # OBS: The generated file contains only anonymous aggregate counts.
        # REQ: Configure these GitHub Actions repository variables:
        #      GA4_PROPERTY_ID
        #      GA4_SERVICE_ACCOUNT
        #      GCP_WORKLOAD_IDENTITY_PROVIDER

      - name: B3) Generate integrated AI context (guide-context.json)
        run: uv run python -m pro_analytics_02.integrated_ai.build_guide_context
        # WHY: Collect documentation text for the guide assistant.
        # WHY: Write docs/assets/data/guide-context.json before building.

      # ============================================================
      # D) DEPLOY: Build and publish docs
      # ============================================================

      - name: D1) Build docs with Zensical
        run: |
          if [ ! -f "zensical.toml" ]; then
            echo "zensical.toml not found; refusing to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          uv run python -m zensical build
        # WHY: Hard-fail if zensical.toml is missing rather than deploying nothing.
        # OBS: In CI (ci-python-zensical.yml) the missing config is a soft skip.
        #      Here it is a hard failure because a deploy without docs is wrong.

      - name: D2) Verify site output exists
        run: |
          if [ ! -d "site" ]; then
            echo "## Documentation build output missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected directory 'site/' was not created." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Zensical build step and zensical.toml configuration." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        # WHY: Catch a silent build failure before attempting to upload an empty artifact.
        # OBS: Zensical outputs to site/ by default; update this path if zensical.toml
        #      configures a different output directory.

      - name: D3) Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
        # WHY: Packages the built static site for the deploy-pages action.
        # OBS: path must match the output directory verified in D2.

      - name: D4) Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        # WHY: Publishes the uploaded artifact to GitHub Pages.
        # OBS: Requires pages: write and id-token: write permissions (set above).
        # OBS: The deployed URL is shown in the Actions log after this step completes.
